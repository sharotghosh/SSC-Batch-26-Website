<script>
// Countdown logic (targeting Dec 31, 2026)
(function(){
  const countdownEl = document.getElementById('countdown');
  const target = new Date('2026-12-31T00:00:00').getTime();
  function update(){
    const now = Date.now();
    const diff = Math.max(0, target - now);
    const days = Math.floor(diff/(1000*60*60*24));
    const hrs = Math.floor((diff/(1000*60*60))%24);
    const mins = Math.floor((diff/(1000*60))%60);
    countdownEl.textContent = `${days}d ${hrs}h ${mins}m`;    
    if(diff>0){requestAnimationFrame(update);} else {countdownEl.textContent='Event started!';}
  }
  update();
})();
// RSVP modal handling
const rsvpBtn=document.getElementById('rsvpBtn');
const rsvpModal=document.getElementById('rsvpModal');
const closeRsvp=document.getElementById('closeRsvp');
rsvpBtn.onclick=()=>{rsvpModal.classList.remove('hidden');};
closeRsvp.onclick=()=>{rsvpModal.classList.add('hidden');};
// Simple success confetti (placeholder)
document.getElementById('rsvpForm').addEventListener('submit', async e => {
  e.preventDefault();
  const form = e.target;
  const data = {
    eventId: 'grand-reunion-2026',
    name: form.querySelector('input[type=text]').value,
    email: form.querySelector('input[type=email]').value,
    guests: parseInt(form.querySelector('input[type=number]').value, 10) || 1
  };
  try {
    const resp = await fetch('/api/rsvp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    const result = await resp.json();
    if (result.success) {
      alert('RSVP submitted! 🎉');
      rsvpModal.classList.add('hidden');
    } else {
      alert('Error: ' + (result.error || 'unknown'));
    }
  } catch (err) {
    alert('Network error: ' + err);
  }
});
// Reveal on scroll
const observer = new IntersectionObserver((entries)=>{entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('is-visible');}})},{threshold:0.15});
observer.observe(document.querySelector('.glass-premium'));
// Generic button activation for any button without specific handler
document.querySelectorAll('button').forEach(btn => {
  if (!btn.dataset.listenerAdded) {
    btn.addEventListener('click', () => {
      alert('Button functionality coming soon!');
    });
    btn.dataset.listenerAdded = 'true';
  }
});
// Join Hub button scroll to welcome section if exists
const joinHubBtn = Array.from(document.querySelectorAll('button')).find(b => b.textContent.includes('Join Hub'));
if (joinHubBtn) {
  joinHubBtn.addEventListener('click', e => {
    e.preventDefault();
    const joinSection = document.getElementById('welcome');
    if (joinSection) joinSection.scrollIntoView({ behavior: 'smooth' });
  });
}
</script>
